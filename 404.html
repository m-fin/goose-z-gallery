<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Goose Z</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4efe6;
        color: #241f1a;
        font-family: Georgia, "Iowan Old Style", serif;
      }
      main { padding: 2rem; max-width: 28rem; }
      p.kicker { letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.8rem; color: #7c6230; }
      a { color: #7c6230; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Goose Z</p>
      <h1>This page is not in the book.</h1>
      <p><a id="home" href="./">Return to the gallery</a></p>
    </main>
    <script>
      var marker = "/goose-z-gallery/";
      var path = location.pathname;
      var at = path.indexOf(marker);
      document.getElementById("home").href = at === -1 ? "./" : path.slice(0, at + marker.length);
    </script>
  </body>
</html>
